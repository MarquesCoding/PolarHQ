name: Orbit
options:
  bundleIdPrefix: com.orbit
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  OrbitKit:
    path: OrbitKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - path: Orbit
    dependencies:
      - package: OrbitKit
        product: OrbitCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbit.app
        INFOPLIST_FILE: Orbit/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
