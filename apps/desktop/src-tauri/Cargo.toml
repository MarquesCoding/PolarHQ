[package]
name = "vault-desktop"
version = "0.0.1"
description = "Vault — your self-hosted encrypted explorer, on the desktop"
authors = ["MarquesCoding"]
edition = "2021"

[lib]
name = "vault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
