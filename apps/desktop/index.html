<!doctype html>
<html lang="en" class="overscroll-none antialiased font-sans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PolarHQ</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem("theme") || "system"
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
        var a = localStorage.getItem("accent")
        if (a && a !== "violet") document.documentElement.setAttribute("data-accent", a)
      } catch (e) {}
      // Mark the Tauri runtime so the overlay-titlebar inset only applies in the native window
      // (not in browser `pnpm dev`). Tauri injects its IPC before page scripts, so this is set early.
      try {
        if (window.__TAURI_INTERNALS__) document.documentElement.classList.add("tauri")
      } catch (e) {}
    </script>
  </head>
  <body class="overscroll-none">
    <div id="root"></div>
    <div id="portal" style="position: fixed; left: 0; top: 0; z-index: 9999"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
