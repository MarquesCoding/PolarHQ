# PolarHQ — production all-in-one stack. Self-contained: no .env file, no
# bind-mounts. Paste this straight into Dockge / Portainer, or run:
#   docker compose -f docker/docker-compose.yml up -d
#
# >>> EDIT THESE BEFORE DEPLOYING:
#   1. AUTH_SECRET (in x-app-env)  — generate your own:  openssl rand -base64 32
#   2. API_URL / WEB_URL           — how you'll reach it: http://<host>:8080
#   3. caddy "8080:80"             — change 8080 to expose a different port
#
# Bundles Postgres (pgvector), Redis and MinIO, runs migrations once, then
# starts the API, the media + backup workers, and the web app.
name: polarhq

x-app-env: &app-env
  NODE_ENV: production
  APP_NAME: PolarHQ
  # !! CHANGE THIS !! generate your own:  openssl rand -base64 32
  AUTH_SECRET: CHANGE_ME_generate_with_openssl_rand_base64_32
  # !! CHANGE THESE !! to how you reach the app, e.g. http://192.168.1.50:8080
  API_URL: http://localhost:8080
  WEB_URL: http://localhost:8080
  DATABASE_URL: postgres://orbit:orbit@postgres:5432/orbit
  REDIS_URL: redis://redis:6379
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: orbitadmin
  S3_SECRET_ACCESS_KEY: orbitadmin
  S3_BUCKET: orbit-media
  S3_FORCE_PATH_STYLE: "true"

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: orbitadmin
      MINIO_ROOT_PASSWORD: orbitadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 orbitadmin orbitadmin;
      mc mb --ignore-existing local/orbit-media;
      mc anonymous set none local/orbit-media;
      exit 0;
      "

  migrate:
    image: ghcr.io/marquescoding/polarhq-app:latest
    command: ["pnpm", "--filter", "@workspace/db", "db:migrate"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/marquescoding/polarhq-app:latest
    environment: *app-env
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  media:
    image: ghcr.io/marquescoding/polarhq-app:latest
    command: ["pnpm", "--filter", "@workspace/media", "start"]
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  backup:
    image: ghcr.io/marquescoding/polarhq-app:latest
    command: ["pnpm", "--filter", "@workspace/backup", "start"]
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: ghcr.io/marquescoding/polarhq-web:latest
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped

  # Single front door. Change the published port here (8080) to whatever you want.
  # The Caddyfile is embedded below (configs) so there's nothing to bind-mount.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

configs:
  caddyfile:
    content: |
      {
      	admin off
      	auto_https off
      }
      :80 {
      	@api path /api/* /ws /ws/* /health /_sodium.js /s/*
      	handle @api {
      		reverse_proxy api:3001
      	}
      	handle {
      		reverse_proxy web:3000
      	}
      }

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
