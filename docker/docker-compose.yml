# PolarHQ — production all-in-one stack. Self-contained: no .env file, no
# bind-mounts. Paste this straight into Dockge / Portainer, or run:
#   docker compose -f docker/docker-compose.yml up -d
#
# >>> EDIT THESE BEFORE DEPLOYING:
#   1. AUTH_SECRET (in x-app-env)  — generate your own:  openssl rand -base64 32
#   2. API_URL / WEB_URL           — how you'll reach it: http://<host>:8080
#   3. caddy "8080:80"             — change 8080 to expose a different port
#
# Bundles Postgres (pgvector) and Redis, runs migrations once, then starts the
# API, the media + backup workers, and the web app. Files are stored on a local
# drive mount (the `storage-data` volume) by default — no S3/MinIO required.
#
# STORAGE — pick ONE:
#   • Local disk (default): nothing to do.
#   • Bundled MinIO (S3):    follow the S3/MinIO block in x-app-env, then start with
#                            `docker compose -f docker/docker-compose.yml --profile minio up -d`.
#   • External S3 (AWS/B2/R2): set STORAGE_DRIVER=s3 + the S3_* vars to your provider; no profile.
name: polarhq

x-app-env: &app-env
  NODE_ENV: production
  APP_NAME: PolarHQ
  # !! CHANGE THIS !! generate your own:  openssl rand -base64 32
  AUTH_SECRET: CHANGE_ME_generate_with_openssl_rand_base64_32
  # !! CHANGE THESE !! to how you reach the app, e.g. http://192.168.1.50:8080
  API_URL: http://localhost:8080
  WEB_URL: http://localhost:8080
  DATABASE_URL: postgres://orbit:orbit@postgres:5432/orbit
  REDIS_URL: redis://redis:6379
  # Files live on a local drive mount. To use your own disk (e.g. a TrueNAS
  # share), change the `storage-data` volume at the bottom to a host bind-mount,
  # e.g.:  storage-data: { driver_opts: { type: none, o: bind, device: /mnt/tank/polarhq } }
  STORAGE_DRIVER: fs
  STORAGE_FS_ROOT: /data/storage
  # --- Object storage (S3 / MinIO) — an ALTERNATIVE to the local disk above. ---
  # To use the bundled MinIO: set STORAGE_DRIVER to s3, uncomment the S3_* lines,
  # and start with the `minio` profile (see the header). For an external S3
  # (AWS, Backblaze B2, Cloudflare R2…), point S3_ENDPOINT/keys at that provider
  # and DON'T enable the minio profile.
  # !! CHANGE THE MINIO CREDENTIALS below (and in the `minio` service) before deploying.
  # S3_ENDPOINT: http://minio:9000
  # S3_REGION: us-east-1
  # S3_ACCESS_KEY_ID: orbitadmin
  # S3_SECRET_ACCESS_KEY: orbitadmin
  # S3_BUCKET: orbit-media
  # S3_FORCE_PATH_STYLE: "true"
  # Optional: back up to Google Drive (Admin → Backup → Connect). Create a Google
  # Cloud OAuth client (Web application) and add this redirect URI:
  #   <API_URL>/api/v1/admin/backup/gdrive/callback
  # GOOGLE_CLIENT_ID: your-client-id.apps.googleusercontent.com
  # GOOGLE_CLIENT_SECRET: your-client-secret

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/marquescoding/polarhq-app:latest
    command: ["pnpm", "--filter", "@workspace/db", "db:migrate"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/marquescoding/polarhq-app:latest
    environment: *app-env
    expose:
      - "3001"
    volumes:
      - storage-data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  media:
    image: ghcr.io/marquescoding/polarhq-app:latest
    command: ["pnpm", "--filter", "@workspace/media", "start"]
    environment: *app-env
    volumes:
      - storage-data:/data/storage
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  backup:
    image: ghcr.io/marquescoding/polarhq-app:latest
    command: ["pnpm", "--filter", "@workspace/backup", "start"]
    environment: *app-env
    volumes:
      - storage-data:/data/storage
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Object storage (opt-in). Only starts with `--profile minio`; the default disk
  # stack ignores it. Pair with STORAGE_DRIVER=s3 + the S3_* vars in x-app-env.
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # !! CHANGE THESE !! and keep them in sync with S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY.
      MINIO_ROOT_USER: orbitadmin
      MINIO_ROOT_PASSWORD: orbitadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket once, then exits.
  minio-init:
    image: minio/mc:latest
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 orbitadmin orbitadmin;
      mc mb --ignore-existing local/orbit-media;
      mc anonymous set none local/orbit-media;
      echo 'MinIO bucket orbit-media ready';
      exit 0;
      "
    restart: "no"

  web:
    image: ghcr.io/marquescoding/polarhq-web:latest
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped

  # Single front door. Change the published port here (8080) to whatever you want.
  # The Caddyfile is embedded below (configs) so there's nothing to bind-mount.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

configs:
  caddyfile:
    content: |
      {
      	admin off
      	auto_https off
      }
      :80 {
      	@api path /api/* /ws /ws/* /health /_sodium.js /s/*
      	handle @api {
      		reverse_proxy api:3001
      	}
      	handle {
      		reverse_proxy web:3000
      	}
      }

volumes:
  postgres-data:
  redis-data:
  # App files (Photos/Drive). Replace with a host bind-mount to use your own disk.
  storage-data:
  # Only used when the `minio` profile is enabled.
  minio-data:
  caddy-data:
  caddy-config:
